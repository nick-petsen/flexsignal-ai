[project]
name = "flexsignal-ai-backend"
version = "0.1.0"
description = "Minimal FastAPI backend for FlexSignal AI read-only decision support."
requires-python = ">=3.11"
dependencies = [
    "alembic",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "psycopg[binary]",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
